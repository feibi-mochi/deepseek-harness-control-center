name: Bug report
description: Report a reproducible plugin problem
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: "Do not paste API keys, wallet files, session content or account information."
  - type: input
    id: harness
    attributes:
      label: DeepSeek Harness version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and Node.js version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
